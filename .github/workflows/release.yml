name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import os
          from tools.package_release import version
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version()[0], 'Tag/version mismatch'
          PY
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: flutter pub get --enforce-lockfile
      - name: Build and verify signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf .signing' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          assert all(os.environ.get(k) for k in required), 'Release signing secrets are required'
          p = Path('.signing'); p.mkdir(exist_ok=True)
          (p / 'release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def escape(v):
              return v.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          (p / 'key.properties').write_text('\n'.join(k + '=' + escape(os.environ[v]) for k, v in [('storePassword', 'STORE_PASSWORD'), ('keyAlias', 'KEY_ALIAS'), ('keyPassword', 'KEY_PASSWORD')]) + '\n')
          PY
          flutter build apk --release --target-platform android-arm,android-arm64
          python3 tools/package_release.py
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['GITHUB_REF_NAME'][1:]
          text = Path('CHANGELOG.md').read_text()
          start = text.index('## ' + version)
          end = text.find('\n## ', start + 4)
          Path('dist/notes.md').write_text(text[start:end if end != -1 else None])
          PY
          gh release create "$GITHUB_REF_NAME" "dist/MJAnime-$version.apk" dist/SHA256SUMS dist/update.json --verify-tag --title "MJAnime $version" --notes-file dist/notes.md
