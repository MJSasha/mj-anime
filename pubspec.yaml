name: animetka_tv
description: Independent Android TV client compatible with the researched Animetka API.
publish_to: none
version: 1.7.0+16
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.10.0
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  material_ui: ^1.11.0
dependency_overrides:
  video_player_android:
    path: packages/video_player_android
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
flutter:
  uses-material-design: true
  assets:
    - assets/Roboto_LICENSE.txt
    - assets/video_check.mp4
  fonts:
    - family: MJSans
      fonts:
        - asset: assets/Roboto-Regular.ttf
        - asset: assets/Roboto-Medium.ttf
          weight: 500
